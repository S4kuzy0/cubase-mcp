[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cubase-mcp"
version = "0.6.0"
description = "Cubase project, MIDI and live control tools"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "mido==1.3.3", "python-rtmidi>=1.5,<2", "pywin32>=308,<313; sys_platform == 'win32'", "tzdata>=2026.5"]

[project.scripts]
cubase-mcp = "cubase_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cubase_mcp = ["_vendor/**/*.txt", "_vendor/**/*.json", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
